name: Go

# ===========================================
# 触发条件
# ===========================================
on:
  # push 到 main / master 分支时触发 (PR merge 后验证)
  push:
    branches: [main, master]
    # tag 推送时也触发 (发版后再次验证 release 包能编译)
    # 配合 scripts/deploy.sh: tag 推送后自动跑一次 CI
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  # 收到指向 main / master 的 PR 时触发
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  # 支持手动触发 (Actions 页面)
  workflow_dispatch:

# ===========================================
# 任务定义
# ===========================================
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      GOTOOLCHAIN: local

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Go
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # 3. 验证依赖完整性
      - name: Verify dependencies
        run: go mod verify

      # 4. 格式化检查 (gofmt)
      - name: Check gofmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "gofmt found issues:"
            gofmt -s -d .
            exit 1
          fi

      # 5. 静态分析 (go vet)
      - name: Run go vet
        run: go vet ./...

      - name: Check vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # 宿主机编译不会应用 .dockerignore；必须构建真实镜像上下文，避免遗漏源码目录。
      - name: Build Docker image
        run: docker build --build-arg VERSION=0.0.0-ci --tag starcat-trending-api:ci .

      # 6. 编译检查
      - name: Build
        run: go build -v -o starcat-trending-api ./cmd/server/

      # 7. 单元测试
      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...
